name: verificar-web-publicada

# Comprueba la web publicada desde fuera (el entorno de desarrollo no llega a Netlify):
# estado HTTP de cada página del sitemap, h1, canonical, formulario y Lighthouse de la portada.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: "URL base publicada"
        required: true
        default: "https://playful-squirrel-a2d50c.netlify.app"

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Páginas y etiquetas
        env:
          BASE: ${{ inputs.url || 'https://playful-squirrel-a2d50c.netlify.app' }}
        run: |
          set -u
          # Tras un push, Netlify tarda en publicar: se espera antes de comprobar.
          [ "${{ github.event_name }}" = "push" ] && sleep 150
          fail=0
          for p in / /es/ /pt/ /en/ /es/como-funciona/ /es/solicitar-presupuesto/ /pt/solicitar-orcamento/ /en/request-quote/ \
                   /es/maquila-suplementos/mexico/ /es/maquila-suplementos/colombia/ /es/fabricacion-complementos-alimenticios/espana/ \
                   /pt/fabricacao-terceirizada-suplementos/brasil/ /es/aviso-legal/ /robots.txt /sitemap.xml /no-existe/; do
            code=$(curl -s -o /tmp/p.html -w "%{http_code}" "$BASE$p")
            h1=$(grep -o '<h1[^>]*>[^<]*' /tmp/p.html | head -1 | sed 's/<h1[^>]*>//')
            canon=$(grep -o '<link rel="canonical" href="[^"]*"' /tmp/p.html | head -1 | sed 's/.*href="//;s/"//')
            form=$(grep -c 'data-netlify' /tmp/p.html || true)
            echo "$code  $p  | h1: ${h1:0:60} | canonical: $canon | form: $form"
            if [ "$p" = "/no-existe/" ]; then [ "$code" = "404" ] || fail=1; else [ "$code" = "200" ] || fail=1; fi
          done
          echo "--- robots.txt"; curl -s "$BASE/robots.txt"
          echo "--- sitemap (primeras líneas)"; curl -s "$BASE/sitemap.xml" | head -12
          echo "--- cabeceras"; curl -sI "$BASE/es/" | grep -iE "^(content-encoding|strict-transport|x-frame|cache-control|content-type)"
          exit $fail
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lighthouse (móvil)
        env:
          BASE: ${{ inputs.url || 'https://playful-squirrel-a2d50c.netlify.app' }}
        run: |
          for p in /es/ /es/maquila-suplementos/mexico/; do
            npx -y lighthouse@12.8.2 "$BASE$p" --quiet --chrome-flags="--headless=new --no-sandbox" \
              --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=lh.json
            node -e "const d=require('./lh.json');console.log('$p',Object.fromEntries(Object.entries(d.categories).map(([k,v])=>[k,Math.round(v.score*100)])));for(const a of Object.values(d.audits)){if(a.score!==null&&a.score<0.9&&['binary','numeric'].includes(a.scoreDisplayMode))console.log('  -',a.id,a.score,a.displayValue||'')}"
          done
